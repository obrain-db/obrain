 du chantier ne filtre par préfixe : le test échoue si un STARTS WITH réapparaît. Garantit C19, fige PI8.'}] AS r MERGE (t:Test {qualified_name: r.q}) ON CREATE SET t.name=r.n, t.pins=r.p, t.status='a_ecrire'

