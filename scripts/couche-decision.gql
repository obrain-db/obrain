UNWIND [{e:'todo:couche-decision:p0s1',g:'connaissance/gate_verite_avant_registre'},{e:'todo:couche-decision:p1s1',g:'connaissance/gate_verite_avant_registre'},{e:'todo:couche-decision:p1s3',g:'connaissance/gate_cablage_tous_constructeurs'},{e:'todo:couche-decision:p3s3',g:'connaissance/gate_preuve_avant_liste_lecture'},{e:'todo:couche-decision:p3s4',g:'connaissance/gate_preuve_avant_liste_lecture'},{e:'todo:couche-decision:p4s1',g:'connaissance/gate_ecriture_par_file'},{e:'todo:couche-decision:p2s4',g:'connaissance/gate_mesurer_avant_refit'},{e:'todo:couche-decision:p5s2',g:'connaissance/gate_coercion_vector'},{e:'todo:couche-decision:p6s1',g:'connaissance/gate_oracle_externe'}] AS r MATCH (a:Todo {qualified_name:r.e}) MATCH (b:Gate {qualified_name:r.g}) MERGE (a)-[:GARDI_PAR]->(b)

# ── 7. Les 19 contraintes ──────────────────────────────────────────────────
UNWIND [{q:'couche-decision/contrainte-c1',s:'C1 — Sans la feature algos, plan_call_procedure n’existe pas : tout CALL échoue à la planification.',c:'Activer algos dans cognitive-full ; les tests l’activent explicitement.',pk:'CONSTATÉ',a:'crates/obrain-engine/src/query/plan.rs:580-585'},{q:'couche-decision/contrainte-c2',s:'C2 — PROCEDURES_DE_LECTURE classe lecture vs écriture ; tout ce qui n’y est pas est traité comme écriture.',c:'decide doit être PROUVÉ lecture seule pour y figurer ; settle ne doit pas y figurer.',pk:'CONSTATÉ',a:'crates/obrain-engine/src/query/plan.rs:320-351'},{q:'couche-decision/contrainte-c3',s:'C3 — Le code dit pourquoi les cognitives sont exclues : CognitiveEngine est un trait à mutabilité intérieure, sa signature ne prouve rien.',c:'La preuve doit être faite, pas déclarée. L’exception spread a exigé code + bench.',pk:'CONSTATÉ',a:'crates/obrain-engine/src/query/plan.rs:335-351'},{q:'couche-decision/contrainte-c4',s:'C4 — Une procédure ne reçoit qu’un store en LECTURE : never used to mutate the graph.',c:'L’écriture passe par les stores du CognitiveEngine, jamais par l’argument.',pk:'CONSTATÉ',a:'crates/obrain-engine/src/cognitive_procedures.rs:38-52'},{q:'couche-decision/contrainte-c5',s:'C5 — Écrire en synchrone depuis le chemin chaud a cassé la prod : 21 threads, sérialisation sur le writer WAL.',c:'settle ENFILE, il n’écrit pas.',pk:'CONSTATÉ',a:'crates/obrain-cognitive/src/synapse.rs:493-502'},{q:'couche-decision/contrainte-c6',s:'C6 — Le câblage est dédoublé : with_config a sa propre copie inline et ne passe pas par with_substrate_store.',c:'Câbler dans tous les constructeurs, et prouver par un test. Coût du dégât : 42 tests.',pk:'CONSTATÉ',a:'crates/obrain-engine/src/database/mod.rs:1100-1120'},{q:'couche-decision/contrainte-c7',s:'C7 — La durabilité n’est pas acquise : perte possible des propriétés écrites après le dernier flush.',c:'Perte asymétrique = biais de survivance. Soit durable, soit comptée et exposée. La nier est la seule option interdite.',pk:'MESURÉ',a:'husk signature, relevé à chaque ouverture de /tmp/dec-test'},{q:'couche-decision/contrainte-c8',s:'C8 — Le piège du vecteur est silencieux et la documentation l’enseigne.',c:'Coercition vector() des deux côtés ; test dédié ; correction de la doc.',pk:'MESURÉ',a:'crates/obrain-common/src/types/value.rs:277'},{q:'couche-decision/contrainte-c9',s:'C9 — Le binaire déployé est minimal : features gql, cypher. Ni vector-index ni embed.',c:'La couche ne dépend d’aucune des deux. Contrainte favorable : elle interdit de dériver vers un encodeur.',pk:'MESURÉ',a:'obrain version sur le binaire de release'},{q:'couche-decision/contrainte-c10',s:'C10 — Lints stricts : unsafe_code warn, missing_docs warn, clippy all et pedantic.',c:'Chaque type public documenté, chaque module avec son //!.',pk:'CONSTATÉ',a:'Cargo.toml:160-169'},{q:'couche-decision/contrainte-c11',s:'C11 — Éviction LRU des caches cognitifs, rechargement à la demande.',c:'decide doit rendre le MÊME résultat après éviction.',pk:'CONSTATÉ',a:'crates/obrain-cognitive/src/config.rs:411-434'},{q:'couche-decision/contrainte-c12',s:'C12 — L’en-tête de cognitive_procedures.rs interdit de tailler une sortie pour un consommateur particulier.',c:'decide rend des lignes neutres ; l’adaptation se fait au-dessus.',pk:'CONSTATÉ',a:'crates/obrain-engine/src/cognitive_procedures.rs:14'},{q:'couche-decision/contrainte-c13',s:'C13 — Une règle de score propre a une propriété testable : l’espérance est minimale à la probabilité vraie.',c:'La Phase 2 est vérifiable sans corpus ni données.',pk:'DÉDUIT',a:'propriété des règles strictement propres'},{q:'couche-decision/contrainte-c14',s:'C14 — Le parseur exige qu’une seule instruction soit consommée par invocation.',c:'Un fichier .gql multi-instructions ne passe pas : un pilote joue ligne par ligne.',pk:'MESURÉ',a:'the entire query must be consumed'},{q:'couche-decision/contrainte-c15',s:'C15 — INSERT d’arête n’est pas idempotent : le rejeu crée un doublon, compté 2.',c:'Utiliser MERGE sur motif d’arête. Ne jamais revenir à INSERT pour une projection rejouable.',pk:'MESURÉ',a:'relevé sur /tmp/gql2'},{q:'couche-decision/contrainte-c16',s:'C16 — order est un mot réservé : ORDER BY p.order échoue.',c:'Nommer la propriété seq, pas order.',pk:'MESURÉ',a:'relevé sur /tmp/dec-graph'},{q:'couche-decision/contrainte-c17',s:'C17 — La concaténation de chaînes en Cypher ne fonctionne pas : le préfixe collé au champ rend 0 résultat, sans erreur.',c:'Mettre les identifiants complets dans les données, jamais les composer dans la requête.',pk:'MESURÉ',a:'deux appels rendant 0 au lieu de 6 et 9'},{q:'couche-decision/contrainte-c18',s:'C18 — ORDER BY sur une propriété après OPTIONAL MATCH échoue.',c:'Trier sur l’alias projeté, ou trier hors de la requête.',pk:'MESURÉ',a:'Variable not found for ORDER BY property projection'},{q:'couche-decision/contrainte-c19',s:'C19 — STARTS WITH est inutilisable : le filtre rend 0 ligne là où l’égalité rend des lignes, ou l’ignore et rend tout.',c:'Ne jamais filtrer par préfixe. Utiliser l’égalité sur qualified_name, ou une propriété dédiée au périmètre.',pk:'MESURÉ',a:'WHERE proof_kind = MESURÉ rend 7 lignes ; STARTS WITH sur le même jeu rend 0'}] AS r MERGE (x:Constraint {qualified_name: r.q}) ON CREATE SET x.statement=r.s, x.consequence=r.c, x.proof_kind=r.pk, x.anchor=r.a

# ── 8. Les 8 pièges ────────────────────────────────────────────────────────
UNWIND [{q:'couche-decision/piege-pi1',d:'Le vecteur silencieux. Un littéral de liste se parse en List ; as_vector n’accepte que Vector ; cosine_similarity rend null ; WHERE null > 0.99 est FAUX, donc la requête rend une liste VIDE et non une erreur.',e:'MESURÉ : littéraux → null ; vector() des deux côtés → 0.9998429417610168 ; WHERE avec coercition → le bon nœud. docs/user-guide/vector-search/basics.md:57 enseigne le geste sans coercition.'},{q:'couche-decision/piege-pi2',d:'Le câblage dédoublé. substrate_handle() rendait None, donc les stores cognitifs tombaient dans le chemin LPG dont les défauts de trait ont un corps vide : les appels réussissaient en ne faisant rien.',e:'CONSTATÉ : crates/obrain-engine/src/database/mod.rs:1100-1120, coût documenté 42 tests.'},{q:'couche-decision/piege-pi3',d:'La persistance synchrone qui sérialise le WAL depuis le chemin chaud.',e:'CONSTATÉ : gotcha 49938809, remède SegQueue + flush_pending_metadata, drainé par le consolidateur ou SIGTERM.'},{q:'couche-decision/piege-pi4',d:'Sans inscription dans PROCEDURES_DE_LECTURE, une session open_read_only refuse la procédure avec Transaction(ReadOnly).',e:'CONSTATÉ : crates/obrain-engine/src/query/plan.rs:344-351.'},{q:'couche-decision/piege-pi5',d:'La perte asymétrique après flush : les propriétés écrites après le dernier flush sont perdues (husk signature).',e:'MESURÉ : WARN post-replay anchor audit, label_only=1 dangling=0 regime=pages_v2, à chaque ouverture.'},{q:'couche-decision/piege-pi6',d:'L’écho auto-référentiel. obrain-rag renforce les synapses entre les concepts mentionnés dans la réponse du LLM lui-même : le graphe apprend de la sortie qu’il a nourrie.',e:'CONSTATÉ : crates/obrain-rag/src/feedback.rs:4.'},{q:'couche-decision/piege-pi7',d:'Le parseur GQL n’accepte qu’une instruction par invocation.',e:'MESURÉ : obrain query --file sur 3 instructions séparées par des points-virgules.'},{q:'couche-decision/piege-pi8',d:'Le filtre par préfixe qui échoue en silence. STARTS WITH rend 0 ligne sans erreur, ou ignore le filtre et rend le jeu complet — et un jeu complet a l’air plausible quand on le lit.',e:'MESURÉ : MATCH (x:Constraint) RETURN count(x) = 19 ; WHERE x.proof_kind = MESURÉ rend 7 ; WHERE x.qualified_name STARTS WITH préfixe rend 0.'}] AS r MERGE (p:Pitfall {qualified_name: r.q}) ON CREATE SET p.description=r.d, p.evidence=r.e, p.status='actif'

# ── 9. Les 14 tests ────────────────────────────────────────────────────────
