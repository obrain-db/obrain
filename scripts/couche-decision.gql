# ── 5. Les 7 portes ─────────────────────────────────────────────────────────
UNWIND [{q:'connaissance/gate_preuve_avant_liste_lecture',n:'preuve_avant_liste_lecture',d:'Avant d’inscrire une procédure dans PROCEDURES_DE_LECTURE, prouver la lecture seule par lecture de code + bench + session open_read_only. La signature d’un trait à mutabilité intérieure ne prouve rien — le code le dit lui-même.'},{q:'connaissance/gate_cablage_tous_constructeurs',n:'cablage_tous_constructeurs',d:'Avant d’ajouter un store cognitif, le câbler dans TOUS les constructeurs. Un constructeur oublié fait rendre None à substrate_handle() : le store retombe sur le chemin LPG dont les défauts de trait ont un corps vide, et l’appel réussit en ne faisant rien. Coût constaté : 42 tests.'},{q:'connaissance/gate_ecriture_par_file',n:'ecriture_par_file',d:'Avant d’écrire depuis un chemin chaud, enfiler dans une SegQueue drainée par le consolidateur et par SIGTERM. L’écriture synchrone a déjà sérialisé le writer WAL sous 21 threads (gotcha 49938809).'},{q:'connaissance/gate_oracle_externe',n:'oracle_externe',d:'Avant de calibrer, exiger une vérité extérieure au modèle. Renforcer depuis la sortie du modèle fait converger la boucle sur elle-même : obrain-rag renforce les synapses entre les concepts mentionnés dans la réponse du LLM.'},{q:'connaissance/gate_coercion_vector',n:'coercion_vector',d:'Avant de comparer une distribution, coercer vector() des DEUX côtés. Sans coercition, cosine_similarity rend null, et WHERE null > x est FAUX : liste vide, aucune erreur. docs/user-guide/vector-search/basics.md:57 enseigne le geste sans coercition.'},{q:'connaissance/gate_mesurer_avant_refit',n:'mesurer_avant_refit',d:'Avant de refitter une température de calibration, mesurer la dérive. Sinon on corrige un défaut qu’on n’a pas constaté.'},{q:'connaissance/gate_verite_avant_registre',n:'verite_avant_registre',d:'Avant d’écrire une seule ligne dans un registre de décisions, établir ce qui, dehors, dira si la décision a eu raison. Sans oracle, le registre se remplit d’opinions et rien n’est mesurable.'}] AS r MERGE (g:Gate {qualified_name: r.q}) ON CREATE SET g.name=r.n, g.description=r.d, g.status='active'

