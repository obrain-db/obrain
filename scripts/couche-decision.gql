UNWIND [{q:'todo:couche-decision:p0s1',seq:1},{q:'todo:couche-decision:p0s2',seq:2},{q:'todo:couche-decision:p1s1',seq:3},{q:'todo:couche-decision:p1s2',seq:4},{q:'todo:couche-decision:p1s3',seq:5},{q:'todo:couche-decision:p1s4',seq:6},{q:'todo:couche-decision:p2s1',seq:7},{q:'todo:couche-decision:p2s2',seq:8},{q:'todo:couche-decision:p2s3',seq:9},{q:'todo:couche-decision:p2s4',seq:10},{q:'todo:couche-decision:p3s1',seq:11},{q:'todo:couche-decision:p3s2',seq:12},{q:'todo:couche-decision:p3s3',seq:13},{q:'todo:couche-decision:p3s4',seq:14},{q:'todo:couche-decision:p4s1',seq:15},{q:'todo:couche-decision:p4s2',seq:16},{q:'todo:couche-decision:p4s3',seq:17},{q:'todo:couche-decision:p4s4',seq:18},{q:'todo:couche-decision:p5s1',seq:19},{q:'todo:couche-decision:p5s2',seq:20},{q:'todo:couche-decision:p5s3',seq:21},{q:'todo:couche-decision:p5s4',seq:22},{q:'todo:couche-decision:p6s1',seq:23},{q:'todo:couche-decision:p6s2',seq:24},{q:'todo:couche-decision:p6s3',seq:25},{q:'todo:couche-decision:p6s4',seq:26}] AS r MATCH (t:Todo {qualified_name:r.q}) MATCH (c:Chantier {qualified_name:'chantier:couche-decision'}) SET t.seq=r.seq MERGE (c)-[:HAS_STEP]->(t)

