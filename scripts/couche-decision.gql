# couche-decision.gql — projection du chantier « couche de décision » dans un graphe obrain.
#
# Source de vérité : docs/ADR-2026-09-22-COUCHE-DECISION.md
# Ce fichier reproduit EXACTEMENT la projection réellement écrite dans parc.obrain :
# 19 contraintes, 8 pièges, 14 tests, 6 risques, 34 ancrages, 26 étapes, 7 portes,
# 3 artefacts, 121 arêtes. Il suit l'idiome DÉJÀ en place dans le graphe :
#   (:Chantier)-[:HAS_STEP]->(:Todo)  ,  (:Todo)-[:NEXT]->(:Todo)  ,  (:Gate)
# et NON un modèle inventé pour l'occasion.
#
# ── FORMES QUI MARCHENT — toutes MESURÉES ───────────────────────────────────
#   · nœuds  : MERGE (n:Label {qualified_name:'…'}) ON CREATE SET …
#              → rejouable, et un status déjà changé SURVIT au rejeu.
#   · arêtes : MERGE (a)-[:TYPE]->(b) entre deux nœuds retrouvés par MATCH.
#   · lots   : UNWIND [ {…}, {…} ] AS r — un bloc UNWIND = UNE instruction.
#
# ── FORMES QUI NE MARCHENT PAS — toutes MESURÉES ────────────────────────────
#   · plusieurs instructions dans un fichier : le parseur exige « the entire query
#     must be consumed » → une seule instruction par invocation.
#   · INSERT (a)-[:TYPE]->(b) : NON idempotent, le rejeu crée un doublon (compté 2).
#   · n.order / ORDER BY p.order : « order » est un mot réservé. D'où « seq ».
#   · STARTS WITH : rend 0 ligne là où l'égalité rend des lignes, ou ignore le
#     filtre et rend tout. NE JAMAIS filtrer par préfixe.
#   · la concaténation de chaînes : 'préfixe' + r.champ rend 0, sans erreur.
#     Mettre les identifiants complets dans les données.
#   · ORDER BY après OPTIONAL MATCH : « Variable not found for ORDER BY property
#     projection ». Trier sur l'alias projeté.
#   · les propriétés d'arête ne sont pas persistées (API nœud uniquement).
#
# ── REPLAY ──────────────────────────────────────────────────────────────────
# Chaque ligne est UNE instruction. Via le pont obrain : une requête par ligne.
# Via le CLI, scripts/couche-decision-ingest.sh joue le fichier ligne par ligne —
# mais le CLI ne peut pas ouvrir en écriture un store tenu par un autre processus,
# donc pas parc.obrain tant que le pont le détient (verrou exclusif).

# ── 1. Le chantier ──────────────────────────────────────────────────────────
MERGE (c:Chantier {qualified_name:'chantier:couche-decision'}) ON CREATE SET c.name='couche-decision', c.description='Couche de décision : faire d’Obrain son propre modèle. Questions typées, probabilités calibrées par comptes, registre dans le substrat, exposé à l’engine par CALL. Source : docs/ADR-2026-09-22-COUCHE-DECISION.md', c.status='propose'

# ── 2. Les 26 étapes (P0..P6) ───────────────────────────────────────────────
UNWIND [{q:'todo:couche-decision:p0s1',n:'P0-S1 inventaire',note:'Recenser les points de décision d’obrain-cognitive : poids de cognitive.search, coefficients d’intent.rs, seuils de reflex.rs, affinity_radius d’immune.rs, constantes d’engram/decay.rs, gate de gap_detection'},{q:'todo:couche-decision:p0s2',n:'P0-S2 recevabilité',note:'Verdict GO/STOP : au moins 3 décisions dont la vérité est observable hors du modèle. GATE du chantier entier.'},{q:'todo:couche-decision:p1s1',n:'P1-S1 modèle de données',note:'Labels :Decision et :DecisionOption, clés _cog_decision_*, identité des options PAR NOM (transfert des comptes), dimension variable.'},{q:'todo:couche-decision:p1s2',n:'P1-S2 DecisionStore',note:'DashMap en cache chaud + write-through vers les propriétés, patron de store_trait.rs. Comptes n/k.'},{q:'todo:couche-decision:p1s3',n:'P1-S3 persistance et câblage',note:'Persistance, rechargement au démarrage, et câblage dans TOUS les constructeurs (piège du câblage dédoublé, 42 tests).'},{q:'todo:couche-decision:p1s4',n:'P1-S4 test de câblage',note:'Prouver que le store utilise le chemin substrat et non les propriétés LPG. Doit exister dès P1, pas en P5.'},{q:'todo:couche-decision:p2s1',n:'P2-S1 Beta et primitives',note:'Postérieur Beta(alpha,beta) et primitives choice, noul, score. Module pur, sans I/O.'},{q:'todo:couche-decision:p2s2',n:'P2-S2 règles de score',note:'Règles strictement propres : log, sphérique, Brier, RPS pour l’ordinal.'},{q:'todo:couche-decision:p2s3',n:'P2-S3 tests mathématiques',note:'Balayage de p : l’espérance du score est minimale à la probabilité vraie. Vérifiable SANS corpus.'},{q:'todo:couche-decision:p2s4',n:'P2-S4 refit après mesure',note:'Mesurer la dérive de calibration d’abord, décider du refit de température ensuite. Pas l’inverse.'},{q:'todo:couche-decision:p3s1',n:'P3-S1 récupération',note:'Récupération Hopfield sur les signatures spectrales des décisions passées : candidats et beta par motif.'},{q:'todo:couche-decision:p3s2',n:'P3-S2 procédure decide',note:'CALL obrain.decide(state, questions) branché dans try_execute_cognitive_procedure. Sortie neutre, sans adaptation à un consommateur.'},{q:'todo:couche-decision:p3s3',n:'P3-S3 preuve de lecture seule',note:'Prouver la lecture : lecture de code + bench + session open_read_only. La signature ne prouve rien, dit le code lui-même.'},{q:'todo:couche-decision:p3s4',n:'P3-S4 inscription lecture',note:'Ajouter decide à PROCEDURES_DE_LECTURE, APRÈS la preuve seulement. settle ne doit jamais y figurer.'},{q:'todo:couche-decision:p4s1',n:'P4-S1 DecisionDelta',note:'settle ENFILE un delta dans une SegQueue. Il n’écrit jamais directement : la persistance synchrone a déjà cassé la prod.'},{q:'todo:couche-decision:p4s2',n:'P4-S2 drain',note:'Drain par le consolidateur ET par le gestionnaire SIGTERM, comme les deltas de synapses.'},{q:'todo:couche-decision:p4s3',n:'P4-S3 pertes exposées',note:'Compteur decisions_lost_total : la perte est comptée et exposée, jamais niée. Sinon biais de survivance.'},{q:'todo:couche-decision:p4s4',n:'P4-S4 survie au redémarrage',note:'Invariant écrites = réglées + en_attente + perdues, vérifié après relance.'},{q:'todo:couche-decision:p5s1',n:'P5-S1 UDF de confiance',note:'Fonction de confiance et seuil utilisable dans un WHERE.'},{q:'todo:couche-decision:p5s2',n:'P5-S2 test du piège vectoriel',note:'Sans vector() : cosine_similarity rend null et WHERE null > x est FAUX, donc liste vide sans erreur. Avec : le bon nœud.'},{q:'todo:couche-decision:p5s3',n:'P5-S3 correction de la doc',note:'docs/user-guide/vector-search/basics.md:57 enseigne le geste SANS coercition. Corriger.'},{q:'todo:couche-decision:p5s4',n:'P5-S4 documenter la couche',note:'docs/cognitive/decisions.md, dans la numérotation des couches existantes.'},{q:'todo:couche-decision:p6s1',n:'P6-S1 brancher l’oracle',note:'Faire arriver la vérité extérieure définie en P0. Aucun oracle auto-référentiel.'},{q:'todo:couche-decision:p6s2',n:'P6-S2 accumuler',note:'Atteindre N décisions réglées.'},{q:'todo:couche-decision:p6s3',n:'P6-S3 mesurer la calibration',note:'ECE sur les décisions réelles, contre classe majoritaire ET contre une constante.'},{q:'todo:couche-decision:p6s4',n:'P6-S4 courbe d’apprentissage',note:'Publier l’évolution de l’ECE en fonction du nombre de décisions réglées.'}] AS r MERGE (t:Todo {qualified_name: r.q}) ON CREATE SET t.name=r.n, t.note=r.note, t.status='a_faire'

