[Service]
# ── LE REGISTRE DES MACHINES CESSE DE VIVRE DANS /tmp (2026-09-16) ──────────
#
# ── INSTALLATION (ce fichier est LIVRÉ DANS LE DÉPÔT, il ne s'installe pas
#    tout seul — un service en vie ne se modifie pas depuis un worktree) ────
#
#   mkdir -p ~/.config/systemd/user/obrain-viz.service.d
#   cp deploy/systemd/obrain-viz.service.d-cache-persistant.conf \
#      ~/.config/systemd/user/obrain-viz.service.d/cache-persistant.conf
#   systemctl --user daemon-reload
#   # puis, quand VOUS le décidez (R7) :
#   systemctl --user restart obrain-viz
#
# Le nom du fichier installé NE PEUT PAS contenir de tiret avant `.conf`
# (convention systemd pour un drop-in) : dans le dépôt il porte son origine, une
# fois posé il s'appelle `cache-persistant.conf`.
#
# ── CE QUI SE PERD SI ON NE LE POSE PAS ────────────────────────────────────
# `obrain-viz` ne pose PAS `OBRAIN_VIZ_CACHE_DIR` (mesuré : /proc/<pid>/environ
# ne contient que OBRAIN_IAM et OBRAIN_IAM_STORE). Tous les journaux du viz
# tombent donc dans `/tmp/obrain-viz-cache`, et le REGISTRE DES MACHINES avec
# eux (`remote.rs`, `dir()` : `…/machines/<hachage du compte>.jsonl`).
#
# Ce registre n'est PAS un cache recalculable : c'est un JOURNAL append-only —
# ce qui a été annoncé, par quel compte, avec quelles capacités, et quand. Il
# est la seule source de la passe `obrain machines --appliquer`
# (`scripts/machines-appliquer.sh`) : registre vide, flotte connaissable vide.
#
# Le mécanisme exact de perte, mesuré et non supposé : `/tmp` n'est PAS un
# tmpfs ici (aucun montage distinct — il est sur la racine), donc un reboot ne
# l'efface pas ; ce qui l'efface, c'est le nettoyage quotidien de systemd,
# `D /tmp 1777 root root 30d` (/usr/lib/tmpfiles.d/tmp.conf), armé par
# `systemd-tmpfiles-clean.timer` (actif). Une machine qui s'est rattachée une
# fois et n'a plus rien écrit depuis 30 jours voit donc son journal disparaître
# sans un mot, et la passe suivante conclut « 0 machine connue ». S'y ajoute ce
# qu'un humain fait de /tmp quand il manque de place : un `rm -rf`.
#
# ── LE CHEMIN CHOISI, ET POURQUOI CELUI-LÀ ─────────────────────────────────
# `~/.local/share/obrain-harness/viz-cache` : le foyer DURABLE de l'utilisateur,
# à côté de `mondes/` (que le drop-in `durable.conf` a déjà sorti de /tmp pour
# la même raison) — et PAS sous `/mnt/obrain/caches/`, dont le nom invite un
# futur nettoyage à vider ce qui doit survivre. Même nom de feuille que
# l'ancien chemin : l'écart est un préfixe, pas une nouvelle convention.
#
# ── CHANGER CE CHEMIN DÉPLACE LE REGISTRE EXISTANT : MIGRER ────────────────
# Le service, après redémarrage, écrira dans le NOUVEAU dossier et ne lira plus
# l'ancien : sans la copie ci-dessous, la flotte déjà connue est perdue de vue
# (les nœuds `machine:` déjà écrits dans les bases, eux, survivent — la passe
# n'efface jamais un fait passé).
#
#   cp -a /tmp/obrain-viz-cache "$HOME/.local/share/obrain-harness/viz-cache"
#
# Mesure du 2026-09-16 18:45 : `/tmp/obrain-viz-cache/machines` N'EXISTE PAS —
# aucune machine ne s'est encore rattachée sur cette machine. La copie est donc
# sans effet aujourd'hui ; elle reste la règle, car rien ne le dira le jour où
# le dossier existera.
#
# ── ET LE LECTEUR DOIT SUIVRE L'ÉCRIVAIN ───────────────────────────────────
# Le service `obrain-machines` lit le même dossier : sans la même variable, la
# passe regarde /tmp et annonce « 0 machine » pendant que le registre est
# ailleurs. Le script refuse ce cas (code 4 : « registre introuvable là où
# l'écrivain l'écrit »), et la variable se pose dans son EnvironmentFile :
#
#   ~/.config/obrain/machines.env :
#     OBRAIN_VIZ_CACHE_DIR=/home/triviere/.local/share/obrain-harness/viz-cache
#
# Les autres producteurs de ce dossier (activation, mémoire, arcs, weave, hubs,
# résonance, entretien) suivent automatiquement : ils lisent tous la même
# variable.
#
# ── CE QUE CE DÉPLACEMENT CASSE AILLEURS, ET QU'IL FAUT POSER AUSSI ────────
# Deux PASSES lisent ce dossier depuis leur propre service, avec leur propre
# environnement — elles ne suivent donc PAS le viz toutes seules :
#   · `obrain-machines.service` (ce dépôt) → POSER la variable dans
#     ~/.config/obrain/machines.env (l'EnvironmentFile de l'unité) ;
#   · `obrain-self-appliquer.service` (le journal du Self des comptes, hors
#     dépôt) → y ajouter `Environment=OBRAIN_VIZ_CACHE_DIR=<ce chemin>`, sinon
#     `memoire-appliquer-comptes.sh` regarde /tmp, n'y trouve plus de journal et
#     annonce « 0 compte » toutes les 2 minutes : la mémoire des comptes cesse
#     d'être appliquée sans que rien ne soit cassé. (Ce script DIT le chemin
#     qu'il regarde — c'est ce qui permet de le voir.)
Environment=OBRAIN_VIZ_CACHE_DIR=%h/.local/share/obrain-harness/viz-cache
