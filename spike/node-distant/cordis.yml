# Nœud distant — harness complet, piloté en JSON-RPC sur stdio.
#
# C'est la copie de `examples/jsonrpc-agent/cordis.yml` du harness, avec UNE
# substitution : l'adaptateur `llm-deepseek` (API payante) est remplacé par
# `llm-pi-ai` déclarant une route OpenAI-compatible vers le llama-server LOCAL.
# L'essai ne coûte donc rien, et il mesure la seule chose qui nous intéresse :
# le TRANSPORT.
#
# Ce fichier n'est pas déployé : il sert à répondre par l'expérience à une
# question ouverte — un harness sur une AUTRE machine peut-il être piloté sans
# écrire de protocole nouveau ?

# stdout est réservé au JSON-RPC : aucun logger console, aucune UI ici.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

# ── LE SEUL CHANGEMENT : une route locale, déclarée à la main ───────────────
# pi-ai ne livre rien sous la clé `local` : le profil fournit donc TOUT le
# fournisseur (`api`, `baseURL`, `models`). C'est exactement le cas d'usage
# documenté — « a self-hosted server … is configuration rather than a code
# change ».
- id: llm
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      local:
        displayName: llama-server local
        api: openai-completions
        baseURL: http://127.0.0.1:9901/v1
        # llama-server ne connaît pas le rôle `developer` et plafonne par
        # `max_tokens` : sans ces deux bascules, pi-ai enverrait la forme
        # OpenAI et le serveur refuserait la requête.
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        defaultContextWindow: 32768
        defaultMaxTokens: 4096
        models:
          - id: qwen-local
            name: Qwen3.5-9B local
            contextWindow: 32768
            maxTokens: 4096
            # Modèle non-raisonnant : déclaré, pas deviné. Sans cette ligne,
            # pi-ai enverrait un paramètre de raisonnement que ce serveur
            # n'attend pas.
            reasoningEfforts: false

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
