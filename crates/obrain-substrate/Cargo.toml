[package]
name = "obrain-substrate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Topology-as-storage substrate: mmap + WAL + fixed-size Pod records + tiered embeddings"

# (2026-08-21) Verrou exclusif inter-processus sur `substrate.meta`.
# Voir la section Safety de src/file.rs : la surete du mmap en depend.
# (2026-09-01) NATIFS SEULEMENT : fs2 ne compile pas pour wasm32 (pas de
# `flock` ni de multi-process dans le navigateur). Le shim de `file.rs`
# (`verrouiller_fichier`/`deverrouiller_fichier`) fournit un no-op wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Verrou de répertoire PAR PROCESSUS (`fcntl(F_SETLK)`), non hérité par un
# enfant pendant sa fenêtre clone→execve — voir `file::verrouiller_fichier`.
libc = "0.2"

[dependencies]
# Graph traits + shared ID/value types. Kept default-features-off so we don't
# pull in LpgStore's tree (rayon, tokio, mmap). The GraphStore trait surface
# only needs the core definitions.
obrain-common.workspace = true
obrain-core = { workspace = true, default-features = false }

# Error handling
thiserror.workspace = true

# Data layout — min_const_generics lets Pod/Zeroable derive for arrays > 32 elements.
bytemuck = { workspace = true, features = ["derive", "min_const_generics"] }

# Memory-mapped I/O
memmap2.workspace = true

# Hashing
crc32fast.workspace = true
foldhash.workspace = true
sha2.workspace = true
# xxh3 64 bits — key_hash canonique des simplexes (spec T3 271180c3 :
# « xxh3 des u32 triés »). Contrat on-disk : changer d'algorithme est une
# rupture de format de la zone SimplexDir.
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_64"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
bincode = { workspace = true }

# Concurrency
parking_lot.workspace = true
dashmap.workspace = true
# Data parallelism for the tiered retrieval scan (T8 step 5).
# Optional dep: only the public retrieval API drags it in; the rest of
# the substrate stays single-threaded by construction.
rayon = { workspace = true }

# Collections (small-label inline storage, matches lpg::Node layout)
smallvec.workspace = true

# Observability
tracing.workspace = true

# Misc
arcstr.workspace = true
byteorder.workspace = true

# Portable clock (std::time::Instant/SystemTime trap on wasm32-unknown-unknown)
web-time = "1"

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
rand.workspace = true
criterion.workspace = true
# Enable obrain-core's `regex` + `parallel` features only for tests — the
# production dep above keeps `default-features = false`.
# `regex` needed by the relocated `operators_filter` integration tests that
# exercise `BinaryFilterOp::Regex` and `BinaryFilterOp::Like` (T17 W4.p4).
# `parallel` needed by the relocated `operators_parallel_source` tests that
# exercise `ParallelNodeScanSource` (T17 Step 3 W2 Class-2, decision
# `b1dfe229`). Both features are part of obrain-core's default set and
# compile cleanly under SubstrateStore.
obrain-core = { workspace = true, default-features = false, features = ["regex", "parallel"] }
# Used only by the T11 Step 5 prefetch bench to read ru_minflt via
# getrusage. Already transitively present through sha2/cpufeatures —
# making it an explicit dev-dep keeps the bench self-contained.
libc = "0.2"

[[bench]]
name = "wal_append"
harness = false

# Phase B — le débit de BOUT EN BOUT du store à N écrivains (pas seulement le
# WAL) : `--multi-processus` lance N processus sur le même store.
[[bench]]
name = "multi_ecrivain_store"
harness = false

# Phase B, pièce 3 — le COÛT de l'internement partagé (table mmapée) face au
# témoin local d'avant la pièce, et face au service entier (create_node).
[[bench]]
name = "intern_registres"
harness = false

[[bench]]
name = "vec_write"
harness = false

[[bench]]
name = "read_path"
harness = false

[[bench]]
name = "memoire_vs_fichier"
harness = false

[[bench]]
name = "decay_all"
harness = false

[[bench]]
name = "hopfield_recall"
harness = false

[[bench]]
name = "tiered_scan"
harness = false

[[bench]]
name = "spreading_activation"
harness = false

[[bench]]
name = "ricci_batch"
harness = false

[[bench]]
name = "heat_step"
harness = false

[[bench]]
name = "forman_batch"
harness = false

[[bench]]
name = "hks_refresh"
harness = false

[[bench]]
name = "geodesic"
harness = false

[[bench]]
name = "effective_resistance"
harness = false

[[bench]]
name = "zorder_analysis"
harness = false

[features]
default = []
# Expose legacy read-only LpgStore ingestion (used only by the obrain-migrate binary).
legacy-reader = []
