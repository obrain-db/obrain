[package]
name = "obrain-web"
version = "0.0.0"
edition = "2024"
license.workspace = true
publish = false
description = "Liaison wasm-bindgen d'obrain pour le navigateur (paquet d'essai, non publié)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
obrain = { path = "../obrain", default-features = false, features = ["browser"] }
wasm-bindgen = "0.2"
serde_json = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
# Profil minimal : GQL seul (le plus petit module).
default = []
browser = []
# Tout ce qui s'exécute dans un navigateur : langages, recherche, algorithmes, cognitif.
complet = [
    "browser", "cypher", "sparql", "gremlin", "graphql", "sql-pgq",
    "vector-index", "text-index", "hybrid-search", "cdc", "algos",
    "cognitive", "metrics", "temporal",
]
cypher = ["obrain/cypher"]
sparql = ["obrain/sparql"]
gremlin = ["obrain/gremlin"]
graphql = ["obrain/graphql"]
sql-pgq = ["obrain/sql-pgq"]
vector-index = ["obrain/vector-index"]
text-index = ["obrain/text-index"]
hybrid-search = ["obrain/hybrid-search"]
cdc = ["obrain/cdc"]
algos = ["obrain/algos"]
cognitive = ["obrain/cognitive"]
metrics = ["obrain/metrics"]
temporal = ["obrain/temporal"]
