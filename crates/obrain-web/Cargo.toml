[package]
name = "obrain-web"
version = "0.0.0"
edition = "2024"
publish = false
description = "Liaison wasm-bindgen d'obrain pour le navigateur (paquet d'essai, non publié)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
obrain = { path = "../obrain", default-features = false, features = ["browser"] }
wasm-bindgen = "0.2"
serde_json = "1"
