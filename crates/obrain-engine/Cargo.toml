[package]
name = "obrain-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Query engine and database management for Obrain"
readme = "README.md"
keywords = ["graph", "database", "gql", "transactions", "obrain"]
categories = ["database-implementations", "database"]

[dependencies]
obrain-common.workspace = true
obrain-core = { workspace = true, default-features = false }
# GQL est LE langage du moteur : toujours compilé (V1-FEATURES-HYGIENE, 01/11).
# La feature `gql` reste déclarée, vide, pour ne casser aucun manifeste.
obrain-adapters = { workspace = true, default-features = false, features = ["gql"] }
obrain-substrate = { workspace = true }

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Data structures
arcstr.workspace = true
smallvec.workspace = true
hashbrown.workspace = true
indexmap.workspace = true

# Concurrency
parking_lot.workspace = true
crossbeam = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

# Memory mapping
memmap2 = { workspace = true, optional = true }

# Serialization
serde.workspace = true
# (mission perf, fusion des doublons) export JSON du backup des perdants.
serde_json = "1"
bincode.workspace = true

# Regex for SPARQL FILTER (use regex-lite for smaller WASM builds)
regex = { workspace = true, optional = true }
regex-lite = { workspace = true, optional = true }

# Cryptographic hashes for SPARQL hash functions (optional, RDF only)
md5 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

# Tracing
tracing.workspace = true

# Cognitive subsystems (optional)
obrain-reactive = { workspace = true, optional = true }
obrain-cognitive = { workspace = true, optional = true, default-features = false }

# Embedding (optional, for ONNX embedding generation)
# ONNX Runtime LIÉ STATIQUEMENT par défaut : binaires fournis par pyke (macOS, iOS, Linux).
# Indispensable pour iOS, où une bibliothèque dynamique ne peut pas être chargée depuis le bundle.
# `ort-dynamic` garde l'ancien comportement (libonnxruntime chargé à l'exécution, via ORT_DYLIB_PATH).
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "api-24"] }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["onig"] }
# hf-hub 1.0 -> hf-xet 1.8 -> xet-runtime 1.8 -> sysinfo 0.39 requires Rust 1.95 (> MSRV 1.91.1).
# Cargo.lock is therefore pinned to hf-xet 1.5.3, xet-client/xet-core-structures/xet-data/xet-runtime 1.5.3,
# sysinfo 0.38.4 (Rust 1.88). Do NOT let Dependabot bump these without re-checking the MSRV.
hf-hub = { version = "1.0", optional = true, features = ["blocking"] }
libc = "0.2.185"

# Portable clock (std::time::Instant/SystemTime trap on wasm32-unknown-unknown)
web-time = "1"

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
serde_json = "1"
# Bases réelles des bancs : désignées par variable, jamais devinées sous $HOME.
# Chemin SANS version : outil non publié, retiré du manifeste par `cargo publish`.
obrain-bases-banc = { path = "../obrain-bases-banc" }
tokio.workspace = true
crc32fast.workspace = true

[features]
# Les tests qui documentent les DÉFAUTS CONNUS du moteur (rouges par
# construction, verts de plein droit le jour de la correction) sont derrière un
# cfg et non une feature Cargo, pour que `--all-features` ne les active pas :
#   RUSTFLAGS="--cfg defauts_connus" cargo test -p obrain-engine
default = ["gql", "parallel", "wal", "spill", "mmap", "regex"]
regex = ["dep:regex", "obrain-core/regex"]
regex-lite = ["dep:regex-lite", "obrain-core/regex-lite"]
gql = []  # sans effet : GQL est toujours compilé (voir la dépendance obrain-adapters)
cypher = ["obrain-adapters/cypher", "regex"]  # le traducteur Cypher émet BinaryOp::Regex (core, gaté regex)
sparql = ["obrain-adapters/sparql", "regex"]  # le planificateur RDF utilise Regex
gremlin = ["obrain-adapters/gremlin", "regex"]  # idem Cypher : BinaryOp::Regex
graphql = ["obrain-adapters/graphql"]
sql-pgq = ["obrain-adapters/sql-pgq"]  # SQL/PGQ (SQL:2023 GRAPH_TABLE)
rdf = ["obrain-core/rdf", "obrain-adapters/rdf", "md5", "sha1", "sha2", "regex"]  # RDF graph model and planner
parallel = ["rayon", "crossbeam", "obrain-core/parallel", "obrain-adapters/parallel"]  # Parallel execution
algos = ["obrain-adapters/algos"]  # Graph algorithm plugin (SSSP, PageRank, etc.)
wal = ["obrain-adapters/wal"]  # Write-ahead log storage
# T17 final cutover (2026-04-23): `obrain-file` feature removed — substrate
# is the single storage backend. The legacy single-file `.obrain` format
# (v1 bincode snapshot, v2 mmap) is archived; users with legacy files run
# `obrain-migrate` once to convert to substrate, then open via
# `ObrainDB::open`/`open_substrate`.
spill = ["obrain-core/spill"]  # Disk spilling for out-of-core execution

mmap = ["obrain-core/mmap"]  # File-backed vector storage
temporal = ["obrain-core/temporal"]  # Append-only versioned properties
tiered-storage = ["obrain-core/tiered-storage"]  # Hot/cold tiered storage with mmap epoch files
# T17 cutover: substrate is now the single storage backend — obrain-substrate
# is an unconditional dep (see [dependencies] above). The former
# `substrate-backend` and `legacy-backend` feature flags were removed.
# Convenience groups
languages = ["gql", "cypher", "sparql", "gremlin", "graphql", "sql-pgq"]  # All query language parsers
ai = ["vector-index", "text-index", "hybrid-search", "cdc"]  # All AI/RAG features
storage = ["wal", "spill", "mmap"]  # Persistent storage (WAL, disk spill, mmap)

# Named profiles (ecosystem-aligned)
embedded = ["gql", "ai", "algos", "parallel", "regex", "jsonl-import"]  # Python libs, MCP, in-process
browser = ["gql", "regex-lite"]  # WASM / obrain-web
server = ["full", "metrics"]  # obrain-server
full = ["languages", "ai", "rdf", "parallel", "algos", "storage", "jsonl-import", "parquet-import"]

# Data import
jsonl-import = ["obrain-core/jsonl-import"]  # JSON Lines file import
parquet-import = ["obrain-core/parquet-import"]  # Apache Parquet file import

# Search & AI features
vector-index = ["obrain-core/vector-index"]  # HNSW vector index for k-NN search
text-index = ["obrain-core/text-index"]  # BM25 inverted index for full-text search
hybrid-search = ["obrain-core/hybrid-search", "text-index", "vector-index"]  # Combined text + vector search
cdc = []  # Change data capture with history API
reactive = []  # Reactive mutation event bus (post-commit hook for obrain-reactive)
cognitive = ["reactive", "dep:obrain-reactive", "dep:obrain-cognitive", "obrain-cognitive/cognitive", "obrain-cognitive/substrate"]  # Cognitive engine (energy + synapses) — substrate routing is the T17 default backing
cognitive-fabric = ["cognitive", "obrain-cognitive/cognitive-fabric"]  # + fabric, co-change, GDS
decision = ["cognitive", "obrain-cognitive/decision"]  # + CALL obrain.decide / obrain.settle (DEC-P1)
cognitive-gap-detection = ["cognitive-fabric", "obrain-cognitive/gap-detection"]  # + CALL obrain.cognitive.detect_gaps
cognitive-synthesis = ["cognitive-fabric", "obrain-cognitive/synthesis"]  # + CALL obrain.cognitive.synthesize
cognitive-full = ["cognitive", "kernel", "obrain-cognitive/cognitive-full", "cognitive-gap-detection", "cognitive-synthesis", "decision", "algos"]  # All cognitive subsystems (algos requis : le dispatch générique des procédures CALL passe par plan_call_procedure, gardé derrière cfg(feature="algos"))
cognitive-engram = ["cognitive", "obrain-cognitive/engram"]  # Engram subsystem (Layer 0: Hebbian + FSRS)
# ── IAM, EN OPT-IN EXPRÈS ────────────────────────────────────────────────────
# `obrain-iam` existait déjà comme dépendance optionnelle de `obrain-cognitive`,
# mais AUCUNE feature du moteur ne la relayait : la chaîne était complète dans le
# code et coupée à l'activation. Cette ligne ouvre le maillon manquant.
# Elle n'est délibérément PAS dans les features par défaut : l'IAM s'active sur
# demande (`--features iam`), pour ne rien changer aux builds en cours — un autre
# agent teste en ce moment, et une feature imposée changerait ses mesures.
kernel = ["cognitive", "obrain-cognitive/kernel"]  # Kernel embeddings (reactive, incremental)
metrics = []  # Lock-free query, transaction, and session metrics
# `embed` : inférence ONNX sur des fichiers LOCAUX (iOS compris).
# `embed-hub` : ajoute le téléchargement depuis Hugging Face. Il tire hf-xet -> sysinfo, qui
# ne compile pas pour iOS : il reste hors du chemin iPhone.
embed = ["ort", "tokenizers"]
embed-hub = ["embed", "hf-hub"]
ort-dynamic = ["ort", "ort/load-dynamic"]  # ONNX Runtime chargé à l'exécution au lieu d'être lié  # ONNX embedding generation (opt-in, adds ~17MB)

# Testing utilities (zero overhead when disabled)
testing-crash-injection = ["obrain-core/testing-crash-injection"]  # Crash injection for recovery testing

[lints]
workspace = true

[[bench]]
name = "tri_borne"
harness = false

[[bench]]
name = "plage_prefixe"
harness = false

[[bench]]
name = "query_bench"
harness = false

[[bench]]
name = "phase_a_write_goulot"
harness = false

[[bench]]
name = "chemin_nanoseconde"
harness = false
