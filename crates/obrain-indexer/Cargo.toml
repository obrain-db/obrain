[package]
name = "obrain-indexer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native code→graph indexer (RFC M6) — replaces the external codebase-memory C indexer"

[dependencies]
obrain-engine = { workspace = true, features = ["gql","storage","parallel","wal","spill","mmap","regex"] }
obrain-common = { workspace = true }
# Graphe cible : types de nœuds/arêtes partagés avec le moteur

# Parsing (RFC M6 §2.2 : tree-sitter, grammaires par module)
# NB : tree-sitter est ajouté ici en attente de montée dans workspace.dependencies
# quand les grammaires prioritaires (rust, c, cpp, python, typescript, go, java)
# seront branchées — une grammaire = un module (RFC M6 §5).
tree-sitter = "0.26"

# Erreurs / utilitaires
thiserror.workspace = true
anyhow.workspace = true

# Concurrence (workers d'extraction parallèles — RFC M6 §2.3)
rayon.workspace = true

# Sérialisation des métadonnées de nœuds/arêtes
serde.workspace = true
serde_json.workspace = true

# Observation
tracing.workspace = true
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
