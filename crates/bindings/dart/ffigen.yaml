# Regenerates lib/src/ffi/bindings.dart from the cbindgen-generated C header
# crates/bindings/c/obrain.h. Do not edit the output by hand.
#
#   dart pub get
#   dart run ffigen --config ffigen.yaml
#
# CI runs the same command and fails if the committed bindings.dart differs
# (freshness check).
name: ObrainBindings
description: >-
  Raw FFI bindings for obrain-c, generated by ffigen from
  crates/bindings/c/obrain.h. Do not edit.
output: 'lib/src/ffi/bindings.dart'
headers:
  entry-points:
    - '../c/obrain.h'
  # Keep only declarations written in obrain.h itself. Without this, the output
  # depends on the host libc (macOS and glibc headers differ), and the
  # freshness diff fails on Linux CI.
  include-directives:
    - '**/obrain.h'
# Only the obrain-c surface is generated: without these filters ffigen also
# emits the system structs pulled in by <stdlib.h> (ucontext, sigaction, ...).
functions:
  include:
    - 'obrain_.*'
enums:
  include:
    - 'ObrainStatus'
structs:
  include:
    - 'Obrain.*'
typedefs:
  include:
    - 'Obrain.*'
# The header is gated by OBRAIN_FEATURE_* macros; the Dart binding exposes the
# full query-language and vector surface, so libobrain_c must be built with
# `--features languages` (see README.md).
compiler-opts:
  - '-DOBRAIN_FEATURE_CYPHER'
  - '-DOBRAIN_FEATURE_GREMLIN'
  - '-DOBRAIN_FEATURE_GRAPHQL'
  - '-DOBRAIN_FEATURE_SPARQL'
  - '-DOBRAIN_FEATURE_SQL_PGQ'
  - '-DOBRAIN_FEATURE_VECTOR_INDEX'
