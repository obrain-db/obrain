name: Mesures (hors portillon)

# Les tests de temps, de débit et de performance sont marqués #[ignore] : un
# runner partagé ne mesure pas (6 runs CI rouges sur 6 avant #16, pour des
# seuils tenus sur une machine calme). Les ignorer sans jamais les exécuter en
# fait des tests morts — leurs motifs deviennent faux en silence.
#
# Ce workflow les exécute par nom, à la demande, et n'est PAS requis pour
# fusionner : un rouge ici est une information à lire, pas un portillon. Pas
# de continue-on-error, pas de retry — le verdict est celui du run. Chaque
# étape porte `if: !cancelled()` : une étape rouge n'empêche pas les suivantes
# de rendre LEUR verdict (premier run : prefetch rouge sur le runner, trois
# étapes sautées sans information), et le job reste rouge.
#
# La référence chiffrée reste une machine Linux calme ; relevé du 2026-10-31
# dans les notes du projet (8 verts déterministes sur 9 ; le 9e, I10, était hors
# contrat et rentre dans le portillon depuis sa réécriture).

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  mesures:
    name: Tests de temps, débit et performance (--ignored, informatif)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Pièces 2 et 3 du WAL (budgets en nanosecondes)
        if: ${{ !cancelled() }}
        run: cargo test -p obrain-substrate --test wal_pieces_2_3_micro -- --ignored mesure_piece
      - name: Prefetch (défauts de page, cache chaud)
        if: ${{ !cancelled() }}
        run: cargo test -p obrain-substrate --test prefetch_page_faults -- --ignored
      - name: WAL interprocessus (t2b, t3, t4, débit à N écrivains)
        if: ${{ !cancelled() }}
        run: |
          ulimit -n 8192
          cargo test -p obrain-substrate --test mw_interprocess_append -- --ignored
      - name: Lectures concurrentes des registres d'index (feature vector-index)
        if: ${{ !cancelled() }}
        run: cargo test -p obrain-engine --features vector-index --test index_concurrency -- --ignored lectures_concurrentes_ne_se_serialisent_pas

  bench-v001:
    name: Benchs de référence v0.0.1 (Criterion, informatif — un runner partagé ne mesure pas)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: make bench-v001 (mesure courte, sans seuil)
        run: BENCH_OPTS="--warm-up-time 1 --measurement-time 2" scripts/bench-v001.sh run
      - name: Conserver les rapports Criterion
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: criterion-${{ github.sha }}
          path: target/criterion
          if-no-files-found: warn
