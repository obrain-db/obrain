  wasm:
    name: Navigateur (wasm32)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","obrain-ci"]') }}
    # La cible wasm32 n'est installée que sur `stable`. Le rustup des runners est
    # en 1.26 : il refuse `rustup default stable --force-non-host` de l'action, et
