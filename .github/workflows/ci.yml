# ── RUNNERS AUTO-HÉBERGÉS (2026-11-03) ───────────────────────────────────────
# Les dépôts sont privés et les minutes GitHub-hosted sont bloquées par la
# facturation (jobs tués en 2–4 s : « recent account payments have failed »).
# Les jobs Linux tournent sur les runners de l'organisation installés sur
# ffs-n1 / ffs-n2 / ffs-n3 (étiquette `obrain-ci`, 16 cœurs, CARGO_BUILD_JOBS=8).
# Quand ce dépôt deviendra public, revenir à `ubuntu-latest` (minutes gratuites,
# et un runner auto-hébergé ne doit pas exécuter les PR de forks).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Appelée par release.yml sur un tag : la publication n'a lieu que si la CI
  # complète est verte SUR LE COMMIT TAGUÉ (pas sur celui d'une PR antérieure).
  workflow_call:

# Rien dans cette CI n'écrit sur le dépôt : lecture seule, partout.
permissions:
  contents: read

# Un push sur une PR rend le run précédent de CETTE PR sans objet : son verdict
# porte sur un arbre qui n'est plus la tête. Les 3 runners auto-hébergés
# restaient sinon occupés par des runs périmés (11/11/2026 : 17 runs en file
# depuis 2 h, dont 13 sur des commits déjà remplacés, ≈ 150 jobs inutiles).
# Hors PR (push sur main, appel par release.yml) le groupe est unique par run :
# rien n'est jamais annulé, et aucun groupe n'entre en collision avec celui de
# release.yml (`release-<ref>`).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Le runner GitHub meurt au link (ld, signal 7, bus error) quand il linke
  # tous les binaires de test en parallele avec les infos de debogage.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

# Actions épinglées par SHA (résolus le 2026-11-01 via l'API GitHub) :
#   actions/checkout@v7.0.1              -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   dtolnay/rust-toolchain (branche stable) -> b725eda525362e7cf34af9a7243cac1e3f01a7ec
#   Swatinem/rust-cache@v2.9.3           -> d1527c8f67ef9af357290475d4af4b0fab8f12e0
#   EmbarkStudios/cargo-deny-action@v2.1.1 -> 3c6349835b2b7b196a839186cb8b78e02f7b5f25
# Une mise à jour change le SHA ET le commentaire, jamais l'un sans l'autre.

jobs:
  lint:
    name: Format, clippy, doc (zéro avertissement)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","obrain-ci"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ── TMPDIR par job (panne disque n3 du 07/11) ───────────────────────────
      # Les tests écrivent leurs stores dans std::env::temp_dir(). Le TMPDIR du
      # runner n'était jamais vidé (21 Go de restes sur n3). Chaque job balaie
      # d'abord les restes de plus de 6 h du TMPDIR du runner, refuse de tourner
      # sous 20 Go libres, puis travaille dans SON répertoire sous RUNNER_TEMP
      # (purgé par le runner entre deux jobs) et le supprime en fin de job.
      - name: Répertoire temporaire du job (balayage, espace, TMPDIR)
        run: |
          if [ -n "${TMPDIR:-}" ] && [ -d "$TMPDIR" ]; then
            find "$TMPDIR" -mindepth 1 -maxdepth 1 -mmin +360 -exec rm -rf {} + 2>/dev/null || true
          fi
          libre=$(df -BG --output=avail "$RUNNER_TEMP" | tail -1 | tr -dc '0-9')
          echo "espace libre sur $RUNNER_TEMP : ${libre:-?} Go"
          if [ "${libre:-0}" -lt 20 ]; then echo "::error::moins de 20 Go libres (${libre:-?} Go) : la CI s'arrête avant de remplir le disque"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/tests"
          echo "TMPDIR=$RUNNER_TEMP/tests" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # La chaîne ÉPINGLÉE (rust-toolchain.toml, 1.91.1) n'est pas celle que
      # `dtolnay/rust-toolchain` équipe de rustfmt/clippy : sur un runner qui ne
      # l'avait pas encore installée, « cargo-fmt is not installed for the
      # toolchain 1.91.1 » (n2, PR #42). Idempotent, sans effet si présent.
      - name: Composants de la chaîne épinglée
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      # ZÉRO avertissement (2026-11-09) : le cliquet `clippy-baseline` est retiré,
      # tout avertissement clippy (lints rustc compris) fait échouer la PR.
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # La documentation doit se construire SANS avertissement : liens intra-doc
      # cassés, liens vers des items privés, HTML non fermé.
      - name: Rustdoc (-D warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features
      - name: Nettoyage du répertoire temporaire du job
        if: always()
        run: rm -rf "$RUNNER_TEMP/tests"

  test:
    name: Tests (features par défaut)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","obrain-ci"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ── TMPDIR par job (panne disque n3 du 07/11) ───────────────────────────
      # Les tests écrivent leurs stores dans std::env::temp_dir(). Le TMPDIR du
      # runner n'était jamais vidé (21 Go de restes sur n3). Chaque job balaie
      # d'abord les restes de plus de 6 h du TMPDIR du runner, refuse de tourner
      # sous 20 Go libres, puis travaille dans SON répertoire sous RUNNER_TEMP
      # (purgé par le runner entre deux jobs) et le supprime en fin de job.
      - name: Répertoire temporaire du job (balayage, espace, TMPDIR)
        run: |
          if [ -n "${TMPDIR:-}" ] && [ -d "$TMPDIR" ]; then
            find "$TMPDIR" -mindepth 1 -maxdepth 1 -mmin +360 -exec rm -rf {} + 2>/dev/null || true
          fi
          libre=$(df -BG --output=avail "$RUNNER_TEMP" | tail -1 | tr -dc '0-9')
          echo "espace libre sur $RUNNER_TEMP : ${libre:-?} Go"
          if [ "${libre:-0}" -lt 20 ]; then echo "::error::moins de 20 Go libres (${libre:-?} Go) : la CI s'arrête avant de remplir le disque"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/tests"
          echo "TMPDIR=$RUNNER_TEMP/tests" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --workspace --all-targets
      # Les tests du substrate ouvrent beaucoup de magasins à la fois : la limite
      # par défaut du runner (256) provoque « Too many open files » et fait
      # échouer une centaine de tests sans rapport avec le code.
      - name: Test
        run: |
          ulimit -n 8192
          cargo test --workspace --no-fail-fast
      - name: Nettoyage du répertoire temporaire du job
        if: always()
        run: rm -rf "$RUNNER_TEMP/tests"

  # (MP-6, 2026-11-07) WAL PARTAGÉ : les tests INTER-PROCESSUS (le binaire de
  # test se relance lui-même en enfants, `kill -9` compris) jouent dans un job
  # à part, un seul à la fois par branche (`concurrency`) : ils mesurent des
  # fenêtres entre processus et ne doivent pas se superposer à un autre run de
  # la même branche. Verdict NOMMÉ : la ligne `test result` est le contrat.
  wal-partage:
    name: WAL partagé (inter-processus)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","obrain-ci"]') }}
    timeout-minutes: 10
    concurrency:
      group: wal-partage-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Substrat — append multi-processus et chaîne CAS
        run: |
          ulimit -n 8192
          cargo test -p obrain-substrate --test mw_interprocess_append --test wal_chaine_cas --no-fail-fast
      - name: Moteur — écriture multi-processus (open_shared_write, kill -9)
        run: |
          ulimit -n 8192
          cargo test -p obrain-engine --test ecriture_multi_processus --no-fail-fast

  # (2026-11-11, suite de #110/#113) BANCS SUR BASES FABRIQUÉES : les cibles
  # qui exigent une base réelle (`CORPUS_*`, `OBRAIN_SONDE_STORE`,
  # `OBRAIN_BANC_BASE`) sont `#[ignore]` et ne tournaient nulle part. Ce job
  # fabrique de PETITES bases jetables, les désigne, et joue ces cibles — qui
  # n'ouvrent qu'une COPIE de la base désignée. Il rejoue aussi les
  # reproductions des défauts connus du moteur (`--cfg defauts_connus`), qui
  # DOIVENT rester rouges tant que le moteur n'est pas corrigé : si elles
  # passent, c'est que le moteur a changé et que le cfg doit être retiré.
  bancs-fabriques:
    name: Bancs sur bases fabriquées (cibles désignées, défauts connus)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: [self-hosted, linux, x64, obrain-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Répertoire temporaire du job (balayage, espace, TMPDIR)
        run: |
          if [ -n "${TMPDIR:-}" ] && [ -d "$TMPDIR" ]; then
            find "$TMPDIR" -mindepth 1 -maxdepth 1 -mmin +360 -exec rm -rf {} + 2>/dev/null || true
          fi
          libre=$(df -BG --output=avail "$RUNNER_TEMP" | tail -1 | tr -dc '0-9')
          echo "espace libre sur $RUNNER_TEMP : ${libre:-?} Go"
          if [ "${libre:-0}" -lt 20 ]; then echo "::error::moins de 20 Go libres (${libre:-?} Go) : la CI s'arrête avant de remplir le disque"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/tests"
          echo "TMPDIR=$RUNNER_TEMP/tests" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fabrication des bases jetables
        run: |
          B="$RUNNER_TEMP/tests/bases"; mkdir -p "$B"
          echo "BASES=$B" >> "$GITHUB_ENV"
          cargo run -p obrain-substrate --example fabrique_bases_banc -- simplexes "$B/a"
          cargo run -p obrain-substrate --example fabrique_bases_banc -- simplexes "$B/b"
          cargo run -p obrain-substrate --example fabrique_bases_banc -- simplexes "$B/db"
          cargo run -p obrain-engine --features cdc --example fabrique_base_cdc -- "$B/cdc" 2000
          OBRAIN_BANC_BASE="$B/grain" cargo test -p obrain-engine --test fabrique_base -- --ignored
          mkdir -p "$B/pas-une-base"
          du -sh "$B"/*
      # Chaque cible copie la base désignée (clone si le système de fichiers
      # le permet) et ne l'ouvre jamais elle-même.
      - name: Cibles converties, sur les bases fabriquées
        run: |
          ulimit -n 8192
          CORPUS_A="$BASES/a" CORPUS_B="$BASES/b" CORPUS_DB="$BASES/db" \
            cargo test -p obrain-substrate --test simplex_passes_materialisation -- --ignored byte_identical_corpus mesures_corpus --test-threads=1 --nocapture
          OBRAIN_SONDE_STORE="$BASES/cdc" \
            cargo test -p obrain-engine --features cdc --test cout_consolidation -- --ignored --nocapture
          OBRAIN_BANC_BASE="$BASES/grain" \
            cargo test -p obrain-engine --test banc_surcout -- --ignored --nocapture
          cargo run -p obrain-engine --example verify_bases -- "$BASES/grain" "$BASES/pas-une-base" | tee verify.txt
          grep -q 'OK nodes=120000' verify.txt
          grep -q 'pas-une-base : SAUTÉE' verify.txt
      # Les bases désignées doivent être restées identiques (les cibles ont
      # travaillé sur des copies) : on les rouvre en lecture et on compare les
      # comptes à ceux de la fabrication.
      - name: Les bases désignées n'ont pas bougé
        run: |
          cargo run -p obrain-engine --example verify_bases -- "$BASES/grain" | grep -q 'OK nodes=120000'
      # Cette étape exigeait le ROUGE de deux reproductions de « open_read_only
      # écrit sur le disque ». Elles sont passées au vert sans être touchées
      # (obrain #115) : elles ont été converties en tests de non-régression
      # ordinaires — `lecture_seule_n_ecrit_pas_dans_la_base` et
      # `lecture_seule_ne_cree_pas_une_base` — et tournent désormais dans le job
      # « Tests (features par défaut) », qui les exécute pour de vrai.
      #
      # La garde n'a donc plus de sujet. Si un défaut moteur est un jour
      # reproduit ici, il se couvre par un test ROUGE ordinaire : un test qui
      # échoue est déjà un rouge de CI, et il n'a pas besoin d'une convention
      # pour le dire.
      - name: Nettoyage du répertoire temporaire du job
        if: always()
        run: rm -rf "$RUNNER_TEMP/tests"

  # (BIND-0, 2026-11-12) ABI C : la bibliothèque `obrain-c` compile contre le
  # moteur, son en-tête commité est EXACTEMENT celui que cbindgen (version
  # épinglée, la même que dans crates/bindings/c/build.rs) régénère, et un
  # programme C réel (tests/smoke.c) ouvre, écrit, relit et libère.
  bindings-c:
    name: Bindings C
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: [self-hosted, linux, x64, obrain-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ── TMPDIR par job (panne disque n3 du 07/11) ───────────────────────────
      - name: Répertoire temporaire du job (balayage, espace, TMPDIR)
        run: |
          if [ -n "${TMPDIR:-}" ] && [ -d "$TMPDIR" ]; then
            find "$TMPDIR" -mindepth 1 -maxdepth 1 -mmin +360 -exec rm -rf {} + 2>/dev/null || true
          fi
          libre=$(df -BG --output=avail "$RUNNER_TEMP" | tail -1 | tr -dc '0-9')
          echo "espace libre sur $RUNNER_TEMP : ${libre:-?} Go"
          if [ "${libre:-0}" -lt 20 ]; then echo "::error::moins de 20 Go libres (${libre:-?} Go) : la CI s'arrête avant de remplir le disque"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/tests"
          echo "TMPDIR=$RUNNER_TEMP/tests" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Compilateur C du runner
        run: cc --version
      # La version est lue dans build.rs (source unique) et DOIT valoir celle
      # attendue ici : changer l'une sans l'autre fait échouer ce job.
      - name: cbindgen (version épinglée)
        run: |
          ATTENDUE=0.29.4
          VERSION=$(sed -n 's/^const CBINDGEN_VERSION: &str = "\(.*\)";$/\1/p' crates/bindings/c/build.rs)
          echo "cbindgen épinglé dans build.rs : $VERSION"
          if [ "$VERSION" != "$ATTENDUE" ]; then echo "::error::build.rs épingle cbindgen $VERSION, ci.yml attend $ATTENDUE : mettre les deux à jour ensemble"; exit 1; fi
          cargo install --locked --version "$VERSION" cbindgen
          cbindgen --version
      - name: Build (cdylib + staticlib, en-tête régénéré par build.rs)
        run: cargo build -p obrain-c
      - name: En-tête commité identique au généré
        run: git diff --exit-code -- crates/bindings/c/obrain.h
      - name: Tests (unitaires, header_a_jour, smoke C)
        run: |
          ulimit -n 8192
          cargo test -p obrain-c -p obrain-bindings-common --no-fail-fast
      - name: Nettoyage du répertoire temporaire du job
        if: always()
        run: rm -rf "$RUNNER_TEMP/tests"

  # ── Bindings Python (pyo3, crates/bindings/python) ─────────────────────────
  # Construit la wheel avec maturin ÉPINGLÉ (la même version que [build-system]
  # de pyproject.toml : changer l'une sans l'autre fait échouer ce job), puis
  # installe la wheel dans un venv neuf et lance pytest contre elle.
  bindings-python:
    name: Bindings Python
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: maturin (version épinglée dans pyproject.toml)
        run: |
          ATTENDUE=1.16.0
          VERSION=$(sed -n 's/^requires = \["maturin==\(.*\)"\]$/\1/p' crates/bindings/python/pyproject.toml)
          echo "maturin épinglé dans pyproject.toml : $VERSION"
          if [ "$VERSION" != "$ATTENDUE" ]; then echo "::error::pyproject.toml épingle maturin $VERSION, ci.yml attend $ATTENDUE : mettre les deux à jour ensemble"; exit 1; fi
          python -m pip install --upgrade pip
          python -m pip install "maturin==$ATTENDUE"
          maturin --version
      - name: Wheel (release)
        run: maturin build --release --manifest-path crates/bindings/python/Cargo.toml --out "$RUNNER_TEMP/dist"
      - name: Venv neuf, installation de la wheel, pytest
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl "pytest>=9" "networkx>=3"
          cd crates/bindings/python
          "$RUNNER_TEMP/venv/bin/python" -m pytest -v -rs
  # ── Intégrations LangChain / LlamaIndex (crates/bindings/python/integrations) ──
  # Même binding, construit avec le même maturin épinglé. Les paquets d'intégration
  # installent leurs versions épinglées (langchain-core, langchain-community,
  # llama-index-core) et lancent leurs tests : aucun appel réseau, aucune clé,
  # LLM factices. -rs affiche tout skip nommé.
  bindings-integrations:
    name: Bindings LangChain/LlamaIndex
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: maturin (version épinglée dans pyproject.toml)
        run: |
          ATTENDUE=1.16.0
          VERSION=$(sed -n 's/^requires = \["maturin==\(.*\)"\]$/\1/p' crates/bindings/python/pyproject.toml)
          echo "maturin épinglé dans pyproject.toml : $VERSION"
          if [ "$VERSION" != "$ATTENDUE" ]; then echo "::error::pyproject.toml épingle maturin $VERSION, ci.yml attend $ATTENDUE : mettre les deux à jour ensemble"; exit 1; fi
          python -m pip install --upgrade pip
          python -m pip install "maturin==$ATTENDUE"
          maturin --version
      - name: Wheel (release)
        run: maturin build --release --manifest-path crates/bindings/python/Cargo.toml --out "$RUNNER_TEMP/dist"
      - name: Venv neuf, wheel, paquets d'intégration (extras test), pytest
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          PY="$RUNNER_TEMP/venv/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install "$RUNNER_TEMP"/dist/*.whl
          "$PY" -m pip install -e "crates/bindings/python/integrations/langchain_obrain[test]" -e "crates/bindings/python/integrations/llama_index_obrain[test]"
          "$PY" -m pytest -v -rs crates/bindings/python/integrations/langchain_obrain/tests
          "$PY" -m pytest -v -rs crates/bindings/python/integrations/llama_index_obrain/tests
  # (BIND-2, 2026-11-12) Liaison Node (napi 3) : le binding compile contre
  # l'engine ; `napi build --release` (CLI épinglé dans package.json)
  # régénère index.d.ts et index.js, et les versions commitées doivent être
  # EXACTEMENT celles générées (même principe que obrain.h) ; la suite Node
  # passe ; le paquet npm se construit sans être publié.
  bindings-node:
    name: Bindings Node
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: crates/bindings/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
