# ── RUNNERS AUTO-HÉBERGÉS (2026-11-03) ───────────────────────────────────────
# Les dépôts sont privés et les minutes GitHub-hosted sont bloquées par la
# facturation (jobs tués en 2–4 s : « recent account payments have failed »).
# Les jobs Linux tournent sur les runners de l'organisation installés sur
# ffs-n1 / ffs-n2 / ffs-n3 (étiquette `obrain-ci`, 16 cœurs, CARGO_BUILD_JOBS=8).
# Quand ce dépôt deviendra public, revenir à `ubuntu-latest` (minutes gratuites,
# et un runner auto-hébergé ne doit pas exécuter les PR de forks).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Rien dans cette CI n'écrit sur le dépôt : lecture seule, partout.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Le runner GitHub meurt au link (ld, signal 7, bus error) quand il linke
  # tous les binaires de test en parallele avec les infos de debogage.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

# Actions épinglées par SHA (résolus le 2026-11-01 via l'API GitHub) :
#   actions/checkout@v7.0.1              -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   dtolnay/rust-toolchain (branche stable) -> b725eda525362e7cf34af9a7243cac1e3f01a7ec
#   Swatinem/rust-cache@v2.9.3           -> d1527c8f67ef9af357290475d4af4b0fab8f12e0
#   EmbarkStudios/cargo-deny-action@v2.1.1 -> 3c6349835b2b7b196a839186cb8b78e02f7b5f25
# Une mise à jour change le SHA ET le commentaire, jamais l'un sans l'autre.

jobs:
  lint:
    name: Format, clippy (cliquet)
    runs-on: [self-hosted, linux, x64, obrain-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # La chaîne ÉPINGLÉE (rust-toolchain.toml, 1.91.1) n'est pas celle que
      # `dtolnay/rust-toolchain` équipe de rustfmt/clippy : sur un runner qui ne
      # l'avait pas encore installée, « cargo-fmt is not installed for the
      # toolchain 1.91.1 » (n2, PR #42). Idempotent, sans effet si présent.
      - name: Composants de la chaîne épinglée
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      # Le code porte des centaines d'avertissements hérités : `-D warnings`
      # d'un coup est hors de portée. Le cliquet interdit d'en AJOUTER
      # (plafond commité dans `clippy-baseline`, à abaisser quand ça descend).
      - name: Clippy (cliquet)
        run: scripts/clippy-ratchet.sh

  test:
    name: Tests (features par défaut)
    runs-on: [self-hosted, linux, x64, obrain-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --workspace --all-targets
      # Les tests du substrate ouvrent beaucoup de magasins à la fois : la limite
      # par défaut du runner (256) provoque « Too many open files » et fait
      # échouer une centaine de tests sans rapport avec le code.
      - name: Test
        run: |
          ulimit -n 8192
          cargo test --workspace --no-fail-fast

  # (MP-6, 2026-11-07) WAL PARTAGÉ : les tests INTER-PROCESSUS (le binaire de
  # test se relance lui-même en enfants, `kill -9` compris) jouent dans un job
  # à part, un seul à la fois par branche (`concurrency`) : ils mesurent des
  # fenêtres entre processus et ne doivent pas se superposer à un autre run de
  # la même branche. Verdict NOMMÉ : la ligne `test result` est le contrat.
  wal-partage:
    name: WAL partagé (inter-processus)
    runs-on: [self-hosted, linux, x64, obrain-ci]
    timeout-minutes: 10
    concurrency:
      group: wal-partage-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Substrat — append multi-processus et chaîne CAS
        run: |
          ulimit -n 8192
          cargo test -p obrain-substrate --test mw_interprocess_append --test wal_chaine_cas --no-fail-fast
      - name: Moteur — écriture multi-processus (open_shared_write, kill -9)
        run: |
          ulimit -n 8192
          cargo test -p obrain-engine --test ecriture_multi_processus --no-fail-fast

  tests-all-features:
    name: Tests (toutes features)
    runs-on: [self-hosted, linux, x64, obrain-ci]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # (V1-EXHAUSTIF, 2026-11-01) « Toutes les features compilent » n'est pas
      # « toutes les features passent » : les binaires de test sous
      # cfg(feature = "cognitive" | "cypher" | "temporal" | …) n'étaient joués
      # nulle part — un interblocage et une double ouverture s'y cachaient.
      - name: Test --all-features
        run: |
          ulimit -n 8192
          cargo test --workspace --all-features --no-fail-fast

  features:
    name: Toutes les features compilent
    runs-on: [self-hosted, linux, x64, obrain-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check --all-features
        run: cargo check --workspace --all-targets --all-features

  # Navigateur (wasm32-unknown-unknown, feature `browser`). Sans ce job, rien ne
  # garantit que la cible compile ni qu'elle s'exécute : le défaut de `main` (la
  # première création de base paniquait) est passé inaperçu faute de cette
  # vérification. Le runner exige node >= 20 et wasm-bindgen-cli à la version
  # EXACTEMENT verrouillée dans Cargo.lock (0.2.130).
  wasm:
    name: Navigateur (wasm32)
    runs-on: [self-hosted, linux, x64, obrain-ci]
    # La cible wasm32 n'est installée que sur `stable`. Le rustup des runners est
    # en 1.26 : il refuse `rustup default stable --force-non-host` de l'action, et
    # le défaut de la machine reste celui qu'elle avait (1.91.1 sur n2, sans cible
    # wasm → « can't find crate for `core` »). On nomme la chaîne au lieu de
    # dépendre du défaut de chaque runner.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: wasm-bindgen-cli (version verrouillée)
        run: |
          VERSION=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          echo "wasm-bindgen verrouillé : $VERSION"
          cargo install --locked --version "$VERSION" wasm-bindgen-cli
      - name: Compilation de la cible navigateur
        run: cargo check --target wasm32-unknown-unknown -p obrain --no-default-features --features browser
      - name: Tests navigateur (profil browser)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          NODE_OPTIONS: --stack-trace-limit=100
        run: cargo test --target wasm32-unknown-unknown -p obrain --no-default-features --features browser --test navigateur_features
      - name: Tests navigateur (requêtes, index, cognitif, métriques, CDC)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          NODE_OPTIONS: --stack-trace-limit=100
        run: cargo test --target wasm32-unknown-unknown -p obrain --no-default-features --features browser,cypher,sparql,gremlin,graphql,sql-pgq,vector-index,text-index,hybrid-search,cdc,algos,cognitive,cognitive-full,metrics,temporal --test navigateur_features

  # Paquet navigateur obrain-web : construit le wasm (profil complet), génère les
  # liaisons JS (nodejs + web) et exécute la batterie partagée de 35 tests sous node.
  # Chrome n'est lancé que si un binaire est présent sur le runner (CHROME_BIN) ;
  # sinon l'étape l'écrit en clair au lieu de passer en silence.
  # Le paquet est publié comme artefact de CI, pas comme version.
  web-paquet:
    name: Paquet navigateur (obrain-web)
    runs-on: [self-hosted, linux, x64, obrain-ci]
    # Cible wasm32 installée sur stable seulement ; défaut des runners non fiable
    # (rustup 1.26 refuse `rustup default --force-non-host`). Voir #54.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: wasm-bindgen-cli (version verrouillée)
        run: |
          VERSION=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install --locked --version "$VERSION" wasm-bindgen-cli
      - name: Compilation (profil complet)
        run: cargo build --target wasm32-unknown-unknown -p obrain-web --release --features complet
      - name: Liaisons JS
        run: |
          W=target/wasm32-unknown-unknown/release/obrain_web.wasm
          wasm-bindgen --target nodejs --out-dir pkg "$W"
          wasm-bindgen --target web --out-dir pkg-web "$W"
      - name: Batterie node
        run: node crates/obrain-web/tests/js/node.mjs pkg
      - name: Batterie Chrome (si disponible)
        run: |
          if [ -n "${CHROME_BIN:-}" ] && [ -x "$CHROME_BIN" ]; then
            CHROME="$CHROME_BIN" bash crates/obrain-web/tests/js/lancer.sh .
          else
            echo "::warning::Chrome absent du runner : batterie navigateur NON exécutée (node seul)"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: obrain-web-pkg
          path: |
            pkg
            pkg-web
          retention-days: 14

  # Persistance navigateur (OPFS) : exécutée dans un Chrome HEADLESS épinglé, en
  # worker dédié (le seul contexte où `createSyncAccessHandle` existe). NON
  # BLOQUANT pour l'instant (décision du RFC) : un échec est signalé, il ne bloque
  # pas la fusion, le temps de stabiliser le navigateur sur les runners.
  persistance-navigateur:
    name: Persistance navigateur (OPFS, Chrome headless)
    runs-on: [self-hosted, linux, x64, obrain-ci]
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: stable
      CHROME_VERSION: "157.0.8103.38"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Chrome et chromedriver (version épinglée)
        # Les runners n'ont pas `unzip` : l'installateur lit les archives avec `yauzl`
        # (lecteur ZIP en JavaScript pur). Installé DANS un répertoire temporaire du job,
        # sans rien modifier sur l'hôte.
        run: |
          set -e
          OUTIL="$RUNNER_TEMP/navigateur"
          mkdir -p "$OUTIL" && cd "$OUTIL"
          # $RUNNER_TEMP persiste entre les jobs : une installation interrompue laisse un
          # dossier de Chrome incomplet, et `browsers install` refuse alors de réinstaller
          # (vu sur n2, 06/11). On repart d'un cache vide à chaque exécution.
          rm -rf "$OUTIL/cache"
          npm init -y > /dev/null
          npm install --no-audit --no-fund @puppeteer/browsers@3.2.6 yauzl@3.4.0
          ./node_modules/.bin/browsers install chrome@$CHROME_VERSION --path "$OUTIL/cache"
          ./node_modules/.bin/browsers install chromedriver@$CHROME_VERSION --path "$OUTIL/cache"
          CD=$(find "$OUTIL/cache" -name chromedriver -type f | head -1)
          echo "$(dirname "$CD")" >> "$GITHUB_PATH"
          # chromedriver ne trouve Chrome qu'à son emplacement par défaut : on indique
          # le binaire installé dans le cache du job, et les options headless.
          CHROME=$(find "$OUTIL/cache" -type f -name chrome | head -1)
          printf '{"goog:chromeOptions": {"binary": "%s", "args": ["--headless=new", "--no-sandbox", "--disable-gpu", "--disable-dev-shm-usage"]}}\n' "$CHROME" > "$OUTIL/webdriver.json"
          echo "WASM_BINDGEN_TEST_WEBDRIVER_JSON=$OUTIL/webdriver.json" >> "$GITHUB_ENV"
      - name: wasm-bindgen-cli (version verrouillée)
        run: |
          VERSION=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install --locked --version "$VERSION" wasm-bindgen-cli
      - name: Test OPFS dans Chrome headless
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --target wasm32-unknown-unknown -p obrain-substrate --test navigateur_opfs
      - name: Persistance de obrain-web dans Chrome headless (worker dédié)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --target wasm32-unknown-unknown -p obrain-web --test navigateur

  msrv:
    name: MSRV (rust-version du manifeste)
    runs-on: [self-hosted, linux, x64, obrain-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lire rust-version
        id: msrv
        run: echo "version=$(grep -E '^rust-version' Cargo.toml | sed -E 's/.*"([0-9.]+)".*/\1/')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (l'action lit `toolchain`)
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check avec la MSRV déclarée
        run: cargo check --workspace

  deny:
    name: cargo deny (licences, advisories, sources)
    runs-on: [self-hosted, linux, x64, obrain-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  package:
    name: Métadonnées de publication
    runs-on: [self-hosted, linux, x64, obrain-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # `cargo package` / `publish --dry-run` exigent que les dépendances
      # internes soient DÉJÀ sur crates.io : impossible avant la publication
      # réelle, séquentielle. On vérifie donc les manifestes, et on package
      # le seul crate sans dépendance interne.
      - name: Manifestes des 8 crates
        run: scripts/check-publish-metadata.sh
      - name: cargo package (premier de l'ordre de publication)
        run: cargo package --no-verify -p obrain-common

  macos:
    name: macOS — intégrité (durabilité, verrous, reprise)
    runs-on: macos-latest
    # Aucun runner macOS auto-hébergé pour l'instant : ce job ne tourne que si la
    # variable de dépôt CI_MACOS vaut "true" (Settings → Variables). Sinon il est
    # « skipped » — ce n'est pas un vert, et il ne faut pas le lire comme tel.
    if: ${{ vars.CI_MACOS == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # La suite complète prend ~12 min sur macOS ; sur PR on ne joue que ce
      # qui dépend de la plateforme : fsync (F_FULLFSYNC), verrous fcntl,
      # processus enfants tués, reprise après crash.
      - name: Tests sensibles à la plateforme
        run: |
          ulimit -n 8192
          cargo test -p obrain-substrate --test verrou_apres_drop --test crash_safety --test wal_recovery_reelle --test migration_versionnee --no-fail-fast
          cargo test -p obrain-engine --test durabilite_commit_kill9 --test echec_commit_rembobinage --test format_fige_v3 --no-fail-fast
