name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Les tests du substrate ouvrent beaucoup de magasins à la fois : la limite
      # par défaut du runner (256) provoque « Too many open files » et fait
      # échouer une centaine de tests sans rapport avec le code.
      - name: Test
        run: |
          ulimit -n 8192
          cargo test --workspace --no-fail-fast
