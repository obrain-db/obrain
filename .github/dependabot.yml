version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      rust-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(rust)"
    # MSRV 1.91.1 (rust-version du workspace) : ces versions exigent un rustc
    # plus récent (parking_lot 0.13 → 1.95, ort rc.14+ → 1.92). Les monter
    # revient à relever le MSRV : décision explicite, pas un bump automatique.
    ignore:
      - dependency-name: "parking_lot"
        versions: [">= 0.13"]
      - dependency-name: "ort"
        versions: [">= 2.0.0-rc.14"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
